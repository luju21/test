<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 调用结果</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #result { white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>API 调用结果</h2>
    <button onclick="loadData()">调用接口</button>
    <div id="result"></div>

    <script>
        async function loadData() {
            try {
                const resp = await fetch('http://127.0.0.1:80/api/v1/heath');
                const data = await resp.text();
                document.getElementById('result').textContent = data;
            } catch (e) {
                document.getElementById('result').textContent = '请求失败: ' + e.message;
            }
        }
        // 页面加载完成后自动调用
        loadData();
    </script>
</body>
</html>
